name: Build & Release RK Festival

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain & ARM targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl,armv7-unknown-linux-musleabihf

      - name: Run tests
        run: cargo test --locked

      - name: Build S905L (aarch64-cpu)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          cargo build --release --locked --target aarch64-unknown-linux-musl
          cp target/aarch64-unknown-linux-musl/release/rk-festival rk-festival-aarch64-cpu

      - name: Build RK3229 (armv7-prebaked)
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: rust-lld
        run: |
          cargo build --release --locked --target armv7-unknown-linux-musleabihf --features prebaked
          cp target/armv7-unknown-linux-musleabihf/release/rk-festival rk-festival-armv7-prebaked

      - name: Publish to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          make_latest: true
          files: |
            rk-festival-aarch64-cpu
            rk-festival-armv7-prebaked
